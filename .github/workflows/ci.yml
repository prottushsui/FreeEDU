name: CI/CD Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run typecheck

      - name: Run schema validation
        run: npm run validate

      - name: Run tests
        run: npm test

      - name: Build Astro site
        run: npm run build

      - name: Verify Pagefind output
        run: |
          if [ ! -d "dist/pagefind" ]; then
            echo "Pagefind index not found!"
            exit 1
          fi
          ls -la dist/pagefind/

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './dist'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Post-deployment smoke tests
        run: |
          echo "Smoke tests would run here against deployed site"

      - name: Post-deployment garbage collection
        if: success()
        run: |
          echo "GC would run here after successful deployment"
